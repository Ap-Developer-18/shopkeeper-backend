# ================== JWT ==================
app.jwt.secret=${JWT_SECRET:CHANGE_THIS_TO_A_LONG_RANDOM_BASE64_SECRET_MIN_256_BITS_1234567890}
# Access token: 15 minutes
app.jwt.access-expiration-ms=900000
# Refresh token: 7 days
app.jwt.refresh-expiration-ms=604800000

# ================== TWILIO (SMS + WhatsApp) ==================
twilio.account-sid=${TWILIO_ACCOUNT_SID:YOUR_TWILIO_ACCOUNT_SID}
twilio.auth-token=${TWILIO_AUTH_TOKEN:YOUR_TWILIO_AUTH_TOKEN}
twilio.sms-from-number=${TWILIO_SMS_FROM:+1XXXXXXXXXX}
twilio.whatsapp-from-number=${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}

# ================== SWAGGER ==================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ================== FILE STORAGE ==================
app.barcode.storage-path=./barcodes

# ================== KHATA REMINDER JOB ==================
app.khata.reminder-cron=0 0 9 * * *