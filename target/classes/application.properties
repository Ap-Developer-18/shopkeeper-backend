# Server
server.port=${PORT:8080}
server.forward-headers-strategy=FRAMEWORK

# Database (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:shopkeeperdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET:CHANGE_THIS_TO_A_LONG_RANDOM_BASE64_SECRET_MIN_256_BITS_1234567890}
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000

# Twilio (Stub Mode Enabled)
twilio.account-sid=${TWILIO_ACCOUNT_SID:YOUR_TWILIO_ACCOUNT_SID}
twilio.auth-token=${TWILIO_AUTH_TOKEN:YOUR_TWILIO_AUTH_TOKEN}
twilio.sms-from-number=${TWILIO_SMS_FROM:+1XXXXXXXXXX}
twilio.whatsapp-from-number=${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Storage & Cron
app.barcode.storage-path=./barcodes
app.khata.reminder-cron=0 0 9 * * *