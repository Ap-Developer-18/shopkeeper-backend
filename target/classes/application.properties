# ================== SERVER ==================
# Railway dynamically assigns a PORT env variable, falls back to 8080 locally
server.port=${PORT:8080}

# Railway reverse proxy ke HTTPS headers ko pass karne ke liye (Fixes Swagger 'Failed to fetch' error)
server.forward-headers-strategy=FRAMEWORK

# ================== DATABASE ==================
# Default: H2 in-memory DB for quick testing.
# Note: In-memory H2 data Railway restart hote hi wipe ho jayega.
spring.datasource.url=jdbc:h2:mem:shopkeeperdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- MySQL on Railway (Jab Railway me MySQL database add karein) ----
