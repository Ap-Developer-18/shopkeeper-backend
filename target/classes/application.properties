# ================== SERVER ==================
server.port=8080

# ================== DATABASE ==================
# Default: H2 in-memory DB for quick local testing.
# Swap to MySQL for production (see commented block below).
spring.datasource.url=jdbc:h2:mem:shopkeeperdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- MySQL (production) example ----
# spring.datasource.url=jdbc:mysql://localhost:3306/shopkeeper_db?useSSL=false&serverTimezone=UTC
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=yourpassword
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ================== JWT ==================
app.jwt.secret=CHANGE_THIS_TO_A_LONG_RANDOM_BASE64_SECRET_MIN_256_BITS_1234567890
# Access token: 15 minutes
app.jwt.access-expiration-ms=900000
# Refresh token: 7 days
app.jwt.refresh-expiration-ms=604800000

# ================== TWILIO (SMS + WhatsApp) ==================
# Get these from https://console.twilio.com
twilio.account-sid=YOUR_TWILIO_ACCOUNT_SID
twilio.auth-token=YOUR_TWILIO_AUTH_TOKEN
twilio.sms-from-number=+1XXXXXXXXXX
twilio.whatsapp-from-number=whatsapp:+14155238886

# ================== OTP POLICY ==================
# (enforced in OtpService) expiry: 5 minutes, max attempts: 5, resend cooldown: 60 seconds

# ================== SWAGGER ==================
# UI available at /swagger-ui.html once the app is running (publicly accessible, no auth required)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ================== FILE STORAGE (barcode images) ==================
app.barcode.storage-path=./barcodes

# ================== KHATA REMINDER JOB ==================
# Runs every day at 9:00 AM server time - checks for due/overdue udhaar entries
app.khata.reminder-cron=0 0 9 * * *
